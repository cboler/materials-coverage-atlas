name: Build Atlas Data

# Runs pipeline/build_atlas.py with the MP_API_KEY repository secret, commits
# public/data/atlas.json, then redeploys. Run manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Re-pull from the Materials Project API instead of using the cached pull'
        type: boolean
        default: false
      sample:
        description: 'Embed a random subset of N materials (blank = all)'
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: 'atlas-data'
  cancel-in-progress: false

jobs:
  build-data:
    name: Fetch, categorize, embed
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      # Same role as the local cache: later runs reuse the API pull and UMAP embedding.
      - name: Restore pipeline cache
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: pipeline-cache-${{ hashFiles('pipeline/fetch.py', 'pipeline/embed.py') }}-${{ github.run_id }}
          restore-keys: pipeline-cache-${{ hashFiles('pipeline/fetch.py', 'pipeline/embed.py') }}-

      - name: Run category rule tests
        run: pytest pipeline

      - name: Build atlas.json
        env:
          MP_API_KEY: ${{ secrets.MP_API_KEY }}
          REFRESH: ${{ inputs.refresh && '--refresh' || '' }}
          SAMPLE: ${{ inputs.sample && format('--sample {0}', inputs.sample) || '' }}
        run: python pipeline/build_atlas.py $REFRESH $SAMPLE

      - name: Commit generated data
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/atlas.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update atlas data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
      - name: Redeploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref ${{ github.ref_name }}
